<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0B0B0D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Pick the theme before first paint (saved choice, else system setting) so the page never flashes -->
    <script>
      (function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
        if (t === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FAFAF8')
        }
      })()
    </script>

    <!-- Social previews (LinkedIn, X, WhatsApp, Slack) -->
    <meta property="og:type" content="profile" />
